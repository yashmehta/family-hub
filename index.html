<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Family Planner · v2.4</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --accent: #0d9488;
      --accent-soft: #f0fdfa;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --purple: #7c3aed;
      --purple-soft: #f5f3ff;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 84px;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      background: #1e293b;
      color: #fff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
    .badge-ver { font-size: 0.68rem; background: rgba(255,255,255,0.16); padding: 2px 7px; border-radius: 999px; font-weight: 600; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .btn-icon {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-icon:active { transform: scale(0.97); }

    .sync-bar {
      background: #e2e8f0;
      color: #334155;
      font-size: 0.74rem;
      padding: 5px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sync-bar.syncing { background: #dbeafe; color: #1e40af; }
    .sync-bar.error { background: #fee2e2; color: #991b1b; }

    main { max-width: 760px; margin: 0 auto; padding: 14px; }
    .view { display: none; }
    .view.active { display: block; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .card.today-card {
      border: 2px solid var(--primary);
      background: linear-gradient(to bottom, #f8fbff, #ffffff);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .day-title { font-weight: 700; font-size: 0.98rem; display: flex; align-items: center; gap: 8px; }
    .today-pill {
      background: var(--primary);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .event-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .event-chip {
      background: #fef3c7;
      color: #92400e;
      font-size: 0.74rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    /* 3-Meal Rows */
    .meal-grid { display: flex; flex-direction: column; gap: 8px; }
    .meal-slot {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 10px;
      background: var(--surface-alt);
    }
    .meal-slot.breakfast { background: var(--amber-soft); border-left: 3px solid var(--amber); }
    .meal-slot.lunch { background: var(--accent-soft); border-left: 3px solid var(--accent); }
    .meal-slot.dinner { background: var(--purple-soft); border-left: 3px solid var(--purple); }

    .slot-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .meal-main-name { font-size: 0.9rem; font-weight: 600; color: var(--text); }
    .meal-notes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .note-tag {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(15,23,42,0.08);
      color: #334155;
    }
    .note-tag.yash { color: #065f46; border-color: #a7f3d0; background: #ecfdf5; }
    .note-tag.xavi { color: #1e40af; border-color: #bfdbfe; background: #eff6ff; }

    .btn-swap {
      background: #fff;
      border: 1px solid var(--border);
      color: #334155;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Lists (Todo & Grocery) */
    .add-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .add-bar input, .add-bar select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      background: #fff;
    }
    .add-bar input { flex: 1; min-width: 170px; }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 9px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 7px;
    }
    .list-item.done { opacity: 0.55; }
    .list-item.done .item-text { text-decoration: line-through; }
    .list-left { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; }
    .list-left input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
    .item-meta { font-size: 0.72rem; color: var(--text-muted); }
    .btn-del { background: none; border: none; color: #94a3b8; font-size: 1.1rem; cursor: pointer; padding: 2px 6px; }

    /* Pool Management */
    .pool-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
    .pill-filter {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .pill-filter.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Bottom Navigation */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 6px 4px env(safe-area-inset-bottom, 8px);
      z-index: 40;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 5px 8px;
      cursor: pointer;
      flex: 1;
    }
    .nav-btn span.ico { font-size: 1.15rem; }
    .nav-btn.active { color: var(--primary); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background: #fff;
      width: 100%;
      max-width: 600px;
      max-height: 82vh;
      border-radius: 18px 18px 0 0;
      padding: 18px;
      overflow-y: auto;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .dish-option {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .dish-option:hover { border-color: var(--primary); background: var(--primary-soft); }
    .section-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
    .section-title { font-size: 1rem; font-weight: 700; }
    .empty-state { text-align: center; padding: 28px 16px; color: var(--text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>🏡 Family Planner <span class="badge-ver">v2.4</span></h1>
    <div class="header-actions">
      <button class="btn-icon" onclick="triggerGenerateSchedule()">✨ Rotate 7d</button>
      <button class="btn-icon" onclick="syncAll(true)">↻ Sync</button>
    </div>
  </header>

  <div id="syncBar" class="sync-bar">
    <span id="syncStatus">Ready</span>
    <span id="todayLabel"></span>
  </div>

  <main>
    <!-- MEALS TAB -->
    <section id="view-meals" class="view active">
      <div class="section-toolbar">
        <div class="section-title">3-Meal Rotation</div>
        <button class="btn-secondary" onclick="togglePastDays()">
          <span id="pastToggleLabel">Show Past Days</span>
        </button>
      </div>
      <div id="mealsContainer"></div>
    </section>

    <!-- GROCERY TAB -->
    <section id="view-grocery" class="view">
      <div class="section-toolbar">
        <div class="section-title">Grocery List</div>
        <button class="btn-secondary" onclick="clearDone('grocery')">Clear Done</button>
      </div>
      <form class="add-bar" onsubmit="handleAddItem(event, 'grocery')">
        <input id="groceryInput" type="text" placeholder="Add grocery item (e.g., Paneer 2 blocks)..." required />
        <select id="groceryCat">
          <option value="Produce">Produce</option>
          <option value="Dairy & Fridge">Dairy & Fridge</option>
          <option value="Pantry & Grains">Pantry & Grains</option>
          <option value="Bakery & Snacks">Bakery & Snacks</option>
          <option value="Baby (Xavi)">Baby (Xavi)</option>
          <option value="Household">Household</option>
        </select>
        <button type="submit" class="btn-primary">Add</button>
      </form>
      <div id="groceryContainer"></div>
    </section>

    <!-- TODO TAB -->
    <section id="view-todo" class="view">
      <div class="section-toolbar">
        <div class="section-title">Family To-Do</div>
        <button class="btn-secondary" onclick="clearDone('todo')">Clear Done</button>
      </div>
      <form class="add-bar" onsubmit="handleAddItem(event, 'todo')">
        <input id="todoInput" type="text" placeholder="Add task..." required />
        <select id="todoAssignee">
          <option value="Family">Family</option>
          <option value="Yash">Yash</option>
          <option value="Simar">Simar</option>
        </select>
        <button type="submit" class="btn-primary">Add</button>
      </form>
      <div id="todoContainer"></div>
    </section>

    <!-- DISH POOL TAB -->
    <section id="view-pool" class="view">
      <div class="section-toolbar">
        <div class="section-title">Dish Pool (<span id="poolCount">0</span>)</div>
        <button class="btn-primary" onclick="openAddDishModal()">+ Add Dish</button>
      </div>
      <div class="pool-filters" id="poolFilters"></div>
      <div id="poolContainer"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-tab="meals" onclick="switchTab('meals')"><span class="ico">🍽️</span>Meals</button>
    <button class="nav-btn" data-tab="grocery" onclick="switchTab('grocery')"><span class="ico">🛒</span>Groceries</button>
    <button class="nav-btn" data-tab="todo" onclick="switchTab('todo')"><span class="ico">✅</span>To-Do</button>
    <button class="nav-btn" data-tab="pool" onclick="switchTab('pool')"><span class="ico">📖</span>Dish Pool</button>
  </nav>

  <!-- SWAP MEAL MODAL -->
  <div id="swapModal" class="modal-backdrop" onclick="closeModalOnBg(event, 'swapModal')">
    <div class="modal-sheet">
      <div class="modal-header">
        <strong id="swapModalTitle">Swap Meal</strong>
        <button class="btn-secondary" onclick="closeModal('swapModal')">Close</button>
      </div>
      <div id="swapOptions"></div>
    </div>
  </div>

  <!-- ADD POOL DISH MODAL -->
  <div id="addDishModal" class="modal-backdrop" onclick="closeModalOnBg(event, 'addDishModal')">
    <div class="modal-sheet">
      <div class="modal-header">
        <strong>Add Dish to Rotation Pool</strong>
        <button class="btn-secondary" onclick="closeModal('addDishModal')">Close</button>
      </div>
      <form onsubmit="handleAddDish(event)" style="display:flex;flex-direction:column;gap:10px;">
        <input id="dishName" type="text" placeholder="Dish Name (include Yash/Xavi notes in parentheses)" required style="padding:10px;border:1px solid var(--border);border-radius:10px;" />
        <div style="display:flex;gap:8px;">
          <select id="dishCuisine" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;">
            <option value="Breakfast">Breakfast</option>
            <option value="Indian">Indian</option>
            <option value="Indo-Chinese">Indo-Chinese</option>
            <option value="Mexican">Mexican</option>
            <option value="Sandwiches">Sandwiches</option>
            <option value="Salads & Soups">Salads & Soups</option>
            <option value="Italian / Pasta">Italian / Pasta</option>
          </select>
          <select id="dishType" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:10px;">
            <option value="Quick (<25m)">Quick (&lt;25m)</option>
            <option value="Curry & Rice">Curry &amp; Rice</option>
            <option value="Pasta / Noodles">Pasta / Noodles</option>
            <option value="One-Pot">One-Pot</option>
            <option value="Weekend Special">Weekend Special</option>
          </select>
        </div>
        <input id="dishPrep" type="number" value="20" min="0" max="120" placeholder="Prep minutes" style="padding:10px;border:1px solid var(--border);border-radius:10px;" />
        <input id="dishIngredients" type="text" placeholder="Key ingredients (comma-separated)" style="padding:10px;border:1px solid var(--border);border-radius:10px;" />
        <button type="submit" class="btn-primary">Save to Dish Pool</button>
      </form>
    </div>
  </div>

  <script>
    // Paste your deployed Apps Script Web App URL here:
    const API_URL = 'YOUR_APPS_SCRIPT_WEB_APP_URL';

    let state = {
      mealPool: [],
      mealSchedule: [],
      lists: [],
      calendarEvents: [],
      settings: {}
    };
    let showPast = false;
    let poolFilter = 'ALL';

    function getLocalTodayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDisplayDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function parseMealNotes(rawName) {
      if (!rawName) return { title: 'Not planned', tags: [] };
      const match = rawName.match(/^(.+?)\s*\((.+?)\)$/);
      if (!match) return { title: rawName, tags: [] };
      const title = match[1].trim();
      const parts = match[2].split(';').map(s => s.trim()).filter(Boolean);
      const tags = parts.map(p => {
        const lower = p.toLowerCase();
        let cls = '';
        if (lower.startsWith('yash')) cls = 'yash';
        else if (lower.startsWith('xavi')) cls = 'xavi';
        return { text: p, cls };
      });
      return { title, tags };
    }

    function setSyncStatus(msg, mode = '') {
      const bar = document.getElementById('syncBar');
      const status = document.getElementById('syncStatus');
      bar.className = 'sync-bar ' + mode;
      status.textContent = msg;
    }

    async function syncAll(manual = false) {
      if (!API_URL || API_URL === 'YOUR_APPS_SCRIPT_WEB_APP_URL') {
        setSyncStatus('Configure API_URL in index.html', 'error');
        return;
      }
      setSyncStatus('Syncing with Google Sheets...', 'syncing');
      try {
        const res = await fetch(`${API_URL}?action=sync&t=${Date.now()}`);
        const json = await res.json();
        if (json.status !== 'ok') throw new Error(json.message || 'Sync failed');
        state = json.data;
        localStorage.setItem('fp_cache_v24', JSON.stringify(state));
        renderAll();
        setSyncStatus('Synced · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      } catch (err) {
        setSyncStatus('Offline / Sync error: ' + err.message, 'error');
      }
    }

    async function postAction(body) {
      setSyncStatus('Saving...', 'syncing');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        });
        const json = await res.json();
        if (json.status !== 'ok') throw new Error(json.message || 'Save failed');
        state = json.data;
        localStorage.setItem('fp_cache_v24', JSON.stringify(state));
        renderAll();
        setSyncStatus('Saved · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      } catch (err) {
        setSyncStatus('Save failed: ' + err.message, 'error');
      }
    }

    function renderAll() {
      document.getElementById('todayLabel').textContent = formatDisplayDate(getLocalTodayKey());
      renderMeals();
      renderList('grocery', 'groceryContainer');
      renderList('todo', 'todoContainer');
      renderPool();
    }

    function renderMeals() {
      const container = document.getElementById('mealsContainer');
      const todayKey = getLocalTodayKey();
      const rows = (state.mealSchedule || []).filter(r => showPast || r.date >= todayKey);

      if (!rows.length) {
        container.innerHTML = `<div class="empty-state">No upcoming meals scheduled.<br/><br/><button class="btn-primary" onclick="triggerGenerateSchedule()">Generate Next 7 Days</button></div>`;
        return;
      }

      const eventsByDate = {};
      (state.calendarEvents || []).forEach(ev => {
        if (!eventsByDate[ev.date]) eventsByDate[ev.date] = [];
        eventsByDate[ev.date].push(ev);
      });

      container.innerHTML = rows.map(day => {
        const isToday = day.date === todayKey;
        const dayEvents = eventsByDate[day.date] || [];
        const eventsHtml = dayEvents.length
          ? `<div class="event-chips">${dayEvents.map(e => `<span class="event-chip">📅 ${e.startTime !== 'All Day' ? e.startTime + ' ' : ''}${escapeHtml(e.title)}</span>`).join('')}</div>`
          : '';

        return `
          <div class="card ${isToday ? 'today-card' : ''}">
            <div class="day-header">
              <div class="day-title">
                <span>${formatDisplayDate(day.date)}</span>
                ${isToday ? '<span class="today-pill">Today</span>' : ''}
              </div>
              <span style="font-size:0.75rem;color:var(--text-muted);">${day.date}</span>
            </div>
            ${eventsHtml}
            <div class="meal-grid">
              ${renderMealSlotHtml(day.date, 'breakfast', 'Breakfast', day.breakfastId, day.breakfastName)}
              ${renderMealSlotHtml(day.date, 'lunch', 'Lunch', day.lunchId, day.lunchName)}
              ${renderMealSlotHtml(day.date, 'dinner', 'Dinner', day.dinnerId, day.dinnerName)}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderMealSlotHtml(date, slot, label, mealId, mealName) {
      const parsed = parseMealNotes(mealName);
      const tagsHtml = parsed.tags.length
        ? `<div class="meal-notes">${parsed.tags.map(t => `<span class="note-tag ${t.cls}">${escapeHtml(t.text)}</span>`).join('')}</div>`
        : '';
      return `
        <div class="meal-slot ${slot}">
          <div>
            <div class="slot-label">${label} ${mealId ? '· ' + escapeHtml(mealId) : ''}</div>
            <div class="meal-main-name">${escapeHtml(parsed.title)}</div>
            ${tagsHtml}
          </div>
          <button class="btn-swap" onclick="openSwapModal('${date}', '${slot}')">Swap</button>
        </div>
      `;
    }

    function renderList(type, containerId) {
      const container = document.getElementById(containerId);
      const items = (state.lists || []).filter(i => i.listType === type);
      if (!items.length) {
        container.innerHTML = `<div class="empty-state">No ${type} items yet.</div>`;
        return;
      }
      // Pending first, completed below
      items.sort((a, b) => Number(a.done) - Number(b.done));
      container.innerHTML = items.map(item => `
        <div class="list-item ${item.done ? 'done' : ''}">
          <label class="list-left">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="postAction({ action: 'toggleListItem', id: '${item.id}', done: this.checked })" />
            <div>
              <div class="item-text">${escapeHtml(item.text)}</div>
              <div class="item-meta">${escapeHtml(item.category)} · ${escapeHtml(item.addedBy)}</div>
            </div>
          </label>
          <button class="btn-del" onclick="postAction({ action: 'deleteListItem', id: '${item.id}' })">✕</button>
        </div>
      `).join('');
    }

    function renderPool() {
      const pool = state.mealPool || [];
      document.getElementById('poolCount').textContent = pool.filter(m => m.active).length + '/' + pool.length;

      const cuisines = ['ALL', ...new Set(pool.map(m => m.cuisine))];
      document.getElementById('poolFilters').innerHTML = cuisines.map(c => `
        <button class="pill-filter ${poolFilter === c ? 'active' : ''}" onclick="setPoolFilter('${c}')">${escapeHtml(c)}</button>
      `).join('');

      const filtered = poolFilter === 'ALL' ? pool : pool.filter(m => m.cuisine === poolFilter);
      document.getElementById('poolContainer').innerHTML = filtered.map(dish => {
        const parsed = parseMealNotes(dish.name);
        return `
          <div class="card" style="opacity:${dish.active ? '1' : '0.55'}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
              <div>
                <div style="font-size:0.74rem;font-weight:700;color:var(--primary);">${escapeHtml(dish.id)} · ${escapeHtml(dish.cuisine)} · ${escapeHtml(dish.type)} (${dish.prepMins}m)</div>
                <div style="font-weight:600;margin-top:2px;">${escapeHtml(parsed.title)}</div>
                ${parsed.tags.length ? `<div class="meal-notes">${parsed.tags.map(t => `<span class="note-tag ${t.cls}">${escapeHtml(t.text)}</span>`).join('')}</div>` : ''}
                ${dish.ingredients ? `<div style="font-size:0.74rem;color:var(--text-muted);margin-top:6px;">🧂 ${escapeHtml(dish.ingredients)}</div>` : ''}
              </div>
              <label style="display:flex;align-items:center;gap:5px;font-size:0.76rem;font-weight:600;cursor:pointer;">
                <input type="checkbox" ${dish.active ? 'checked' : ''} onchange="postAction({ action: 'togglePoolDish', id: '${dish.id}', active: this.checked })" />
                Active
              </label>
            </div>
          </div>
        `;
      }).join('');
    }

    function setPoolFilter(c) {
      poolFilter = c;
      renderPool();
    }

    function togglePastDays() {
      showPast = !showPast;
      document.getElementById('pastToggleLabel').textContent = showPast ? 'Hide Past Days' : 'Show Past Days';
      renderMeals();
    }

    function switchTab(tab) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + tab).classList.add('active');
      document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add('active');
    }

    function handleAddItem(e, listType) {
      e.preventDefault();
      if (listType === 'grocery') {
        const input = document.getElementById('groceryInput');
        const cat = document.getElementById('groceryCat').value;
        postAction({ action: 'addListItem', item: { listType: 'grocery', text: input.value, category: cat, addedBy: 'Family' } });
        input.value = '';
      } else {
        const input = document.getElementById('todoInput');
        const who = document.getElementById('todoAssignee').value;
        postAction({ action: 'addListItem', item: { listType: 'todo', text: input.value, category: 'General', addedBy: who } });
        input.value = '';
      }
    }

    function clearDone(listType) {
      postAction({ action: 'clearCompleted', listType });
    }

    function triggerGenerateSchedule() {
      postAction({ action: 'generateSchedule', days: 7, forceOverwrite: false });
    }

    function openSwapModal(date, slot) {
      const isBreakfast = slot === 'breakfast';
      const candidates = (state.mealPool || []).filter(m =>
        m.active && (isBreakfast ? m.cuisine.toLowerCase() === 'breakfast' : m.cuisine.toLowerCase() !== 'breakfast')
      );
      document.getElementById('swapModalTitle').textContent = `Select ${slot.charAt(0).toUpperCase() + slot.slice(1)} (${formatDisplayDate(date)})`;
      document.getElementById('swapOptions').innerHTML = candidates.map(m => `
        <div class="dish-option" onclick="selectSwapDish('${date}', '${slot}', '${m.id}', ${JSON.stringify(m.name).replace(/"/g, '&quot;')})">
          <div style="font-size:0.72rem;font-weight:700;color:var(--primary);">${escapeHtml(m.id)} · ${escapeHtml(m.cuisine)} · ${m.prepMins}m</div>
          <div style="font-weight:600;font-size:0.9rem;">${escapeHtml(m.name)}</div>
        </div>
      `).join('');
      document.getElementById('swapModal').classList.add('open');
    }

    function selectSwapDish(date, slot, mealId, mealName) {
      closeModal('swapModal');
      postAction({ action: 'updateMealSlot', date, slot, mealId, mealName });
    }

    function openAddDishModal() {
      document.getElementById('addDishModal').classList.add('open');
    }

    function handleAddDish(e) {
      e.preventDefault();
      const dish = {
        name: document.getElementById('dishName').value,
        cuisine: document.getElementById('dishCuisine').value,
        type: document.getElementById('dishType').value,
        prepMins: Number(document.getElementById('dishPrep').value || 20),
        ingredients: document.getElementById('dishIngredients').value
      };
      closeModal('addDishModal');
      e.target.reset();
      postAction({ action: 'addPoolDish', dish });
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function closeModalOnBg(e, id) {
      if (e.target.id === id) closeModal(id);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Boot: load cached snapshot immediately, then sync live
    (function init() {
      const cached = localStorage.getItem('fp_cache_v24');
      if (cached) {
        try {
          state = JSON.parse(cached);
          renderAll();
        } catch (e) {}
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
      syncAll();
    })();
  </script>
</body>
</html>
